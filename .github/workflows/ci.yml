# Lint, typecheck, test and build, then smoke-test the packed tarball on every supported
# Node.js version. Runs on pushes to the release branches and on pull requests; release.yml
# also runs it before releasing.
name: CI

on:
  push:
    branches:
      - main
      - "[0-9]+.x"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Pack and check the tarball contents
        run: |
          mkdir pack
          npm pack --pack-destination pack --json > pack/manifest.json
          node -e '
            const [manifest] = JSON.parse(require("fs").readFileSync("pack/manifest.json", "utf8"));
            const files = manifest.files.map((f) => f.path);
            console.log(files.join("\n"));
            const allowed = /^(dist\/index\.(c?js|d\.c?ts|c?js\.map)|README\.md|LICENSE|CHANGELOG\.md|package\.json)$/;
            const unexpected = files.filter((f) => !allowed.test(f));
            if (unexpected.length) throw new Error("unexpected files in the package: " + unexpected.join(", "));
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error

  smoke:
    name: Smoke test on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the tarball and load it with require() and import
        run: |
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../pack/*.tgz
          node -e '
            const { rgb2hex, hex2rgb } = require("precise-colors");
            if (rgb2hex(hex2rgb("#3399cc")) !== "3399cc") throw new Error("require() gave a wrong result");
          '
          node --input-type=module -e '
            import { rgb2hex, hex2rgb } from "precise-colors";
            if (rgb2hex(hex2rgb("#3399cc")) !== "3399cc") throw new Error("import gave a wrong result");
          '
