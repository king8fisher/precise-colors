# Releases the version in package.json of the branch it is run on. It only runs when you
# start it: Actions → Release → Run workflow, or `gh workflow run release.yml --ref <branch>`.
#
# Each run does the next step for that branch, after CI passes:
# - version not on npm yet: stage it on npm (staged publishing through Trusted Publishing,
#   no token) and draft a GitHub release from its CHANGELOG section;
# - staged and approved on npm since: publish the draft GitHub release, which creates the
#   vX.Y.Z tag on the released commit.
# Approving the staged version on npmjs.com (or with `npm stage approve`) needs 2FA.
#
# One-time setup: see RELEASING.md.
name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    name: Plan release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # draft releases, which record staged versions, are only visible with write access
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - id: staged
        name: List versions staged on npm (draft releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft) | .tagName | ltrimstr("v")] | join(",")')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          STAGED_VERSIONS: ${{ steps.staged.outputs.versions }}
        run: bun .github/scripts/release-plan.ts

  stage:
    name: Stage ${{ needs.plan.outputs.version }} on npm
    needs: plan
    if: needs.plan.outputs.stage == 'true'
    runs-on: ubuntu-latest
    environment: npm
    # One release at a time across all branches, so each run sees what the previous one
    # staged (the dist-tag is fixed at staging time and must not be "latest" twice)
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write # draft the GitHub release
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm >= 11.15.0 for staged publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds
      - run: bun install --frozen-lockfile
      - id: staged
        name: List versions staged on npm (draft releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft) | .tagName | ltrimstr("v")] | join(",")')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Plan again now that this run holds the release lock
        env:
          STAGED_VERSIONS: ${{ steps.staged.outputs.versions }}
        run: bun .github/scripts/release-plan.ts
      - name: Build
        if: steps.plan.outputs.stage == 'true'
        run: bun run typecheck && bun run build
      - name: Stage on npm
        if: steps.plan.outputs.stage == 'true'
        env:
          NPM_TAG: ${{ steps.plan.outputs.npm-tag }}
        run: npm stage publish --provenance --tag "$NPM_TAG"
      - name: Draft the GitHub release
        if: steps.plan.outputs.stage == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          NPM_TAG: ${{ steps.plan.outputs.npm-tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
          echo "::notice::Staged ${TAG#v} on npm as \"$NPM_TAG\". Approve it on npmjs.com (Staged Packages) or with npm stage approve, using 2FA, then run this workflow again to publish the GitHub release."

  finalize:
    name: Publish approved releases
    needs: [plan, stage]
    # Runs when nothing needed staging too, to publish releases approved on npm since the last run
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish draft releases, which creates their tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/finalize-releases.ts
